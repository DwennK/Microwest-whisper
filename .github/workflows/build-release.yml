name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install frontend dependencies
        run: npm ci

      - name: Test release tooling
        run: node --test scripts/check-release.mjs

      - name: Verify pinned native dependencies
        run: npm run verify:native-manifest

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build:frontend

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            artifact: microwest-whisper-macos-arm64
            paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            artifact: microwest-whisper-windows-x64
            paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

    env:
      MICROWEST_BUNDLE_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Verify updater credentials and release version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/verify-release-secrets.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install CMake on macOS
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Verify native build tools
        run: cmake --version

      - name: Build pinned whisper.cpp and fetch FFmpeg
        run: python scripts/fetch-whispercpp-binaries.py

      - name: Sign bundled macOS native tools ad-hoc
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in whisper-cli ffmpeg; do
            codesign --force --sign - "engine/whispercpp/bin/macos-aarch64/$binary"
          done

      - name: Build installers with signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:release

      - name: Verify macOS architecture and ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Microwest Whisper.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$app/Contents/MacOS/microwest-whisper")" = arm64
          for binary in whisper-cli ffmpeg; do
            native="$app/Contents/Resources/engine/whispercpp/bin/macos-aarch64/$binary"
            codesign --verify --strict "$native"
            test "$(lipo -archs "$native")" = arm64
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Normalize release asset names
        run: node scripts/normalize-release-assets.mjs release-artifacts

      - name: Generate updater manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/generate-updater-manifest.mjs release-artifacts

      - name: Generate checksums
        shell: bash
        run: |
          find release-artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.tar.gz' -o \
            -name '*.sig' -o \
            -name 'latest.json' \
          \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > release-artifacts/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          checksum_notes="$(
            awk '{ printf "- `%s`  `%s`\n", $1, $2 }' release-artifacts/SHA256SUMS.txt
          )"
          release_notes="$(cat docs/RELEASE_INSTALLATION.md)"
          release_notes+=$'\n\n'
          release_notes+="$(printf '## SHA-256 checksums\n\n%s\n\nThe full checksum file is also attached as `SHA256SUMS.txt`.' "$checksum_notes")"
          printf '%s\n' "$release_notes" > "$RUNNER_TEMP/release-notes.md"
          mapfile -d '' release_files < <(
            find release-artifacts -type f \( \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.tar.gz' -o \
              -name '*.sig' -o \
              -name 'latest.json' -o \
              -name 'SHA256SUMS.txt' \
            \) -print0
          )
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi
          gh release create "$TAG_NAME" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md"
